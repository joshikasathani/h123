<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Hospital Booking System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Payment Processing</h1>
            <p>Complete your payment after treatment</p>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">← Back to Home</a></li>
            <li><a href="admin/register-hospital.html">Admin Panel</a></li>
        </ul>
    </nav>

    <main>
        <div class="container">
            <div class="form-container">
                <div id="appointmentInfo" class="appointment-info">
                    <!-- Appointment information will be loaded here -->
                </div>

                <h2>Payment Details</h2>
                <form id="paymentForm" action="backend/process-payment.php" method="POST">
                    <input type="hidden" id="appointmentId" name="appointment_id">
                    <input type="hidden" id="hospitalId" name="hospital_id">
                    <input type="hidden" id="patientName" name="patient_name">
                    
                    <div class="form-group">
                        <label for="totalAmount">Total Amount ($) *</label>
                        <input type="number" id="totalAmount" name="total_amount" step="0.01" min="0" required>
                        <span class="error" id="totalAmountError"></span>
                    </div>

                    <div class="form-group">
                        <label for="paymentMethod">Payment Method *</label>
                        <select id="paymentMethod" name="payment_method" required>
                            <option value="">Select Payment Method</option>
                            <option value="cash">Cash</option>
                            <option value="credit_card">Credit Card</option>
                            <option value="debit_card">Debit Card</option>
                            <option value="online">Online Payment</option>
                            <option value="insurance">Insurance</option>
                        </select>
                        <span class="error" id="paymentMethodError"></span>
                    </div>

                    <div class="revenue-split">
                        <h3>Revenue Distribution</h3>
                        <div class="split-details">
                            <div class="split-item">
                                <strong>Hospital (90%):</strong>
                                <span id="hospitalAmount">$0.00</span>
                            </div>
                            <div class="split-item">
                                <strong>Admin (10%):</strong>
                                <span id="adminAmount">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn">Process Payment</button>
                        <button type="button" onclick="window.location.href='index.html'" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>

                <div id="message" class="message" style="display: none;"></div>
            </div>
        </div>
    </main>

    <script src="js/validation.js"></script>
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const appointmentId = urlParams.get('appointment_id');

        // Load appointment information when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (appointmentId) {
                loadAppointmentInfo(appointmentId);
                document.getElementById('appointmentId').value = appointmentId;
            } else {
                // Redirect to home if no appointment ID provided
                window.location.href = 'index.html';
            }

            // Calculate revenue split when amount changes
            document.getElementById('totalAmount').addEventListener('input', calculateRevenueSplit);
        });

        function loadAppointmentInfo(appointmentId) {
            const appointmentInfo = document.getElementById('appointmentInfo');
            
            // Fetch appointment details
            fetch(`backend/get-appointment-details.php?id=${appointmentId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const appointment = data.appointment;
                        document.getElementById('hospitalId').value = appointment.hospital_id;
                        document.getElementById('patientName').value = appointment.patient_name;
                        
                        appointmentInfo.innerHTML = `
                            <div class="appointment-card">
                                <h3>Appointment Details</h3>
                                <div class="info">
                                    <strong>Patient:</strong> ${appointment.patient_name}
                                </div>
                                <div class="info">
                                    <strong>Hospital:</strong> ${appointment.hospital_name}
                                </div>
                                <div class="info">
                                    <strong>Date:</strong> ${appointment.appointment_date}
                                </div>
                                <div class="info">
                                    <strong>Time:</strong> ${appointment.appointment_time}
                                </div>
                                <div class="info">
                                    <strong>Treatment Status:</strong> 
                                    <span class="status ${appointment.treatment_status}">${appointment.treatment_status}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        appointmentInfo.innerHTML = `
                            <div class="error">
                                Error loading appointment information. Please go back and try again.
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error loading appointment details:', error);
                    appointmentInfo.innerHTML = `
                        <div class="error">
                            Error loading appointment information. Please go back and try again.
                        </div>
                    `;
                });
        }

        function calculateRevenueSplit() {
            const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
            
            const hospitalAmount = totalAmount * 0.9; // 90% to hospital
            const adminAmount = totalAmount * 0.1;    // 10% to admin
            
            document.getElementById('hospitalAmount').textContent = '$' + hospitalAmount.toFixed(2);
            document.getElementById('adminAmount').textContent = '$' + adminAmount.toFixed(2);
        }

        // Payment form validation
        function validatePaymentForm() {
            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.error').forEach(element => {
                element.textContent = '';
            });
            
            // Total Amount validation
            const totalAmount = document.getElementById('totalAmount').value.trim();
            if (totalAmount === '') {
                document.getElementById('totalAmountError').textContent = 'Total amount is required';
                isValid = false;
            } else if (parseFloat(totalAmount) <= 0) {
                document.getElementById('totalAmountError').textContent = 'Amount must be greater than 0';
                isValid = false;
            }
            
            // Payment Method validation
            const paymentMethod = document.getElementById('paymentMethod').value;
            if (paymentMethod === '') {
                document.getElementById('paymentMethodError').textContent = 'Please select a payment method';
                isValid = false;
            }
            
            return isValid;
        }

        // Handle form submission
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (validatePaymentForm()) {
                // Submit form using fetch for better UX
                const formData = new FormData(this);
                
                fetch('backend/process-payment.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    const messageDiv = document.getElementById('message');
                    
                    if (data.success) {
                        messageDiv.className = 'message success';
                        messageDiv.textContent = data.message;
                        messageDiv.style.display = 'block';
                        
                        // Reset form after successful payment
                        this.reset();
                        
                        // Redirect to home after 3 seconds
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 3000);
                    } else {
                        messageDiv.className = 'message error';
                        messageDiv.textContent = data.message;
                        messageDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('Error processing payment:', error);
                    const messageDiv = document.getElementById('message');
                    messageDiv.className = 'message error';
                    messageDiv.textContent = 'Error processing payment. Please try again.';
                    messageDiv.style.display = 'block';
                });
            }
        });
    </script>

    <style>
        .revenue-split {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            border: 2px solid #e9ecef;
        }

        .revenue-split h3 {
            margin-bottom: 1rem;
            color: #495057;
        }

        .split-details {
            display: flex;
            justify-content: space-between;
            gap: 2rem;
        }

        .split-item {
            flex: 1;
            text-align: center;
            padding: 1rem;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .split-item strong {
            display: block;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .split-item span {
            font-size: 1.2rem;
            font-weight: bold;
            color: #28a745;
        }

        .appointment-card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border-left: 4px solid #667eea;
        }

        .status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status.completed {
            background: #d4edda;
            color: #155724;
        }

        .status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .status.cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .split-details {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</body>
</html>
